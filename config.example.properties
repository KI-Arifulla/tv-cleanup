# Arif Home TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Your location, for the sunrise and sunset that turn the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…)
language=auto

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto
